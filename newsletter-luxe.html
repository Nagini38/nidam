<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter - Nidam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cream: #F5F0EB;
            --warm-white: #FAF8F5;
            --charcoal: #2D2926;
            --gold: #B8956A;
            --gold-light: #D4C4A8;
            --text-muted: #7A7067;
            --stone: #E8E0D6;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            color: var(--charcoal);
            background-color: var(--warm-white);
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(245, 240, 235, 0.95);
            backdrop-filter: blur(12px);
            z-index: 1000;
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(184, 149, 106, 0.2);
            transition: all 0.3s ease;
        }
        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: var(--charcoal);
            text-decoration: none;
            text-transform: uppercase;
        }
        .nav-links {
            display: flex;
            gap: 3rem;
            list-style: none;
        }
        .nav-links a {
            color: var(--charcoal);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
            position: relative;
            transition: color 0.3s ease;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.3s ease;
        }
        .nav-links a:hover { color: var(--gold); }
        .nav-links a:hover::after { width: 100%; }

        /* Page Header */
        .page-header {
            margin-top: 60px;
            padding: 5rem 5% 4rem;
            text-align: center;
            background: var(--cream);
        }
        .page-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 1rem;
        }
        .page-header .separator {
            width: 50px;
            height: 1px;
            background: var(--gold);
            margin: 0 auto 1.5rem;
        }
        .page-header p {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Newsletter List */
        .newsletter-list {
            max-width: 900px;
            margin: 3rem auto;
            padding: 0 5%;
        }

        .newsletter-article {
            background: white;
            border: 1px solid var(--stone);
            margin-bottom: 2rem;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        .newsletter-article:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .article-image {
            width: 100%;
            height: 300px;
            overflow: hidden;
        }

        .article-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .newsletter-article:hover .article-image img {
            transform: scale(1.03);
        }

        .article-body {
            padding: 2rem 2.5rem;
        }

        .article-date {
            display: inline-block;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.8rem;
        }

        .article-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: var(--charcoal);
            margin-bottom: 1rem;
        }

        .article-content {
            font-size: 0.95rem;
            line-height: 1.9;
            color: var(--text-muted);
            font-weight: 300;
        }

        /* Empty state */
        .newsletter-empty {
            text-align: center;
            padding: 5rem 2rem;
            color: var(--text-muted);
        }

        .newsletter-empty p {
            font-size: 1rem;
            font-style: italic;
        }

        /* Footer */
        footer {
            background: var(--charcoal);
            color: rgba(255,255,255,0.5);
            padding: 4rem 5%;
            margin-top: 4rem;
        }
        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .footer-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.8);
        }
        .footer-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }
        .footer-links a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }
        .footer-links a:hover { color: var(--gold); }

        /* Admin button */
        .admin-link {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            width: 40px;
            height: 40px;
            background: rgba(45, 41, 38, 0.15);
            border: none;
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            text-decoration: none;
            font-size: 1.1rem;
            color: var(--charcoal);
        }
        .admin-link:hover { opacity: 1; background: rgba(45, 41, 38, 0.25); }

        /* Scroll top */
        .scroll-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 45px;
            height: 45px;
            background: var(--gold);
            color: white;
            border: none;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .scroll-top.visible { opacity: 1; }
        .scroll-top:hover { transform: translateY(-3px); background: var(--charcoal); }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links { gap: 1.5rem; }
            .nav-links a { font-size: 0.7rem; letter-spacing: 1px; }
            .page-header h1 { font-size: 2.5rem; }
            .article-body { padding: 1.5rem; }
            .article-title { font-size: 1.4rem; }
            .article-image { height: 200px; }
            .footer-content { flex-direction: column; gap: 2rem; text-align: center; }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <a href="index-luxe.html" class="logo">Nidam</a>
        <ul class="nav-links">
            <li><a href="index-luxe.html">Accueil</a></li>
            <li><a href="galerie-luxe.html">Galerie</a></li>
            <li><a href="newsletter-luxe.html">Newsletter</a></li>
            <li><a href="contact-luxe.html">Contact</a></li>
        </ul>
    </nav>

    <!-- Header -->
    <section class="page-header">
        <h1>Newsletter</h1>
        <div class="separator"></div>
        <p>Restez informés des dernières actualités de Nidam</p>
    </section>

    <!-- Newsletter Articles -->
    <section class="newsletter-list"></section>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-logo">Nidam</div>
            <ul class="footer-links">
                <li><a href="index-luxe.html">Accueil</a></li>
                <li><a href="galerie-luxe.html">Galerie</a></li>
                <li><a href="newsletter-luxe.html">Newsletter</a></li>
                <li><a href="contact-luxe.html">Contact</a></li>
            </ul>
        </div>
    </footer>

    <!-- Admin link -->
    <a href="admin.html" class="admin-link" title="Administration">&#9881;</a>

    <!-- Scroll to top -->
    <button class="scroll-top" id="scrollTop">&#8593;</button>

    <script src="site-content.js"></script>
    <script>
        // Scroll to top button
        const scrollTopBtn = document.getElementById('scrollTop');
        window.addEventListener('scroll', () => {
            scrollTopBtn.classList.toggle('visible', window.pageYOffset > 300);
        });
        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Load dynamic content from admin
        if (typeof SiteContent !== 'undefined') {
            SiteContent.applyToNewsletter();
        }
    </script>
</body>
</html>
